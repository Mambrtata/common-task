[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoho-mail-mcp"
version = "0.1.0"
description = "MCP konektor na Zoho Mail – prístup len na čítanie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3.0", "starlette>=0.40", "uvicorn>=0.30", "pypdf>=4.0"]

[project.scripts]
zoho-mail-mcp = "zoho_mail_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
